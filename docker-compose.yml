services:
  app:
    build: .
    ports:
      - "8009:8009"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/spendless-product
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: vyrazu

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: spendless-product
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vyrazu